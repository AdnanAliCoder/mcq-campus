name: Django Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Django system check
        env:
          DEBUG: "false"
          SECRET_KEY: "ci-check-secret"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
        run: python manage.py check
      - name: Validate frontend JavaScript syntax
        run: for file in frontend/assets/js/*.js; do node --check "$file"; done
      - name: Test authentication role resolution
        env:
          DEBUG: "false"
          SECRET_KEY: "ci-check-secret"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
        run: >-
          python manage.py test
          core.tests.IntegrationTests.test_super_admin_permission_resolves_to_super_admin_role_and_workspace
          core.tests.IntegrationTests.test_staff_profile_with_legacy_learner_role_resolves_to_admin
          core.tests.IntegrationTests.test_super_admin_country_workspace_scopes_dashboard_mcqs_and_entities
          core.tests.IntegrationTests.test_active_country_scopes_public_content_catalog_and_student_site
          --verbosity 2
      - name: Test cache utilities
        env:
          DEBUG: "false"
          SECRET_KEY: "ci-check-secret"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
        run: python manage.py test core.test_cache_utils --verbosity 2
