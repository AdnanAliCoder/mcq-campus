name: Django Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Django system check
        env:
          DEBUG: "false"
          SECRET_KEY: "ci-check-secret"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
        run: python manage.py check
      - name: JavaScript syntax check
        run: node --check frontend/assets/js/public.js && node --check frontend/assets/js/auth.js && node --check frontend/assets/js/admin.js
      - name: Django test suite
        env:
          DEBUG: "false"
          SECRET_KEY: "ci-check-secret"
          ALLOWED_HOSTS: "127.0.0.1,localhost"
        run: python manage.py test
