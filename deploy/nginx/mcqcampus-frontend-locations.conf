# Include inside the existing HTTPS server block; preserve TLS/server_name.
# This is an include snippet, not a complete vhost. Replace the existing catch-all proxy.
root /home/ubuntu/mcq-campus/frontend;
index index.html;
charset utf-8;

# The unified entry assets live at the frontend root, not inside frontend/assets/.
location = /assets/style.css {
    alias /home/ubuntu/mcq-campus/frontend/style.css;
    access_log off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
}
location = /assets/script.js {
    alias /home/ubuntu/mcq-campus/frontend/script.js;
    access_log off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
}
location ^~ /api/ { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 5s; proxy_read_timeout 120s; }
location = /robots.txt { proxy_pass http://127.0.0.1:8000/robots.txt; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
location = /llms.txt { proxy_pass http://127.0.0.1:8000/llms.txt; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
location = /sitemap.xml { proxy_pass http://127.0.0.1:8000/sitemap.xml; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
location ~ ^/sitemap-(index|pages|categories|papers|jobs|years|mcqs|resources)\.xml$ { proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
location ^~ /assets/ { alias /home/ubuntu/mcq-campus/frontend/assets/; access_log off; expires 30d; add_header Cache-Control "public, max-age=2592000"; }
location = /favicon.ico { return 301 /assets/favicon.svg; }
location = /favicon.svg { alias /home/ubuntu/mcq-campus/frontend/assets/favicon.svg; access_log off; expires 30d; }
location = /sw.js { alias /home/ubuntu/mcq-campus/frontend/sw.js; add_header Cache-Control "no-cache"; }
location = /past-papers/pdfs { try_files /pdfs.html /index.html; }
location = /pdfs { return 301 /past-papers/pdfs; }
location = /papers { return 301 /past-papers; }
location = /jobs { return 301 /past-papers; }
location = /jobs-exams { return 301 /past-papers; }
location = /posts { return 301 /blog; }
location = /index.html { return 301 /; }
location = /index.php { return 301 /; }
location = /mcqs/all-mcqs { return 301 /mcqs; }
location = /categories/all-categories { return 301 /categories; }
location = /past-papers/all-past-papers { return 301 /past-papers; }
location = /profile { return 301 /dashboard/settings; }
location = /my-downloads { return 301 /dashboard/downloads; }
location = /user-dashboard { return 301 /dashboard; }
location = /user-dashboard/profile { return 301 /dashboard/settings; }
location ^~ /django-admin/ { return 404; }
location / {
    try_files $uri $uri.html /index.html;
    # HTML must be revalidated so asset URL version changes reach browsers immediately.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
