  <template id="mcq-layout-template"><div class="mcq-site-layout"><!-- SLOT:LAYOUT_HEADER --><!-- SLOT:LAYOUT_HEADER_AD --><main id="main" tabindex="-1"><!-- SLOT:LAYOUT_BODY --></main><!-- SLOT:LAYOUT_FOOTER_AD --><!-- SLOT:LAYOUT_FOOTER --></div></template>
