<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCQ Campus Preview</title>
<style>
:root{--g:#0f6b4f;--gd:#102823;--bg:#f4f7f6;--b:#dfe8e5;--m:#6c7b76;--w:#fff;--r:14px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#17211e}
button,input{font:inherit}.top{height:64px;background:var(--w);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:800}.brand b{color:var(--g)}.mode{border:1px solid var(--b);background:#fff;border-radius:10px;padding:8px 12px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}.side{background:var(--gd);color:#fff;padding:20px 14px}.role{padding:14px;border-radius:12px;background:#183a33;margin-bottom:16px}.role small{display:block;opacity:.7;margin-top:4px}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#d9e9e4;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#235247;color:#fff}
.main{padding:28px;max-width:1450px}.hero{background:linear-gradient(135deg,#102823,#155f49);color:#fff;padding:34px;border-radius:20px;margin-bottom:22px}.hero h1{font-size:36px;margin:0 0 8px}.hero p{max-width:700px;color:#d6e8e1}
.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#21a06d;color:#fff}.ghost{background:#fff;color:#16372f;border:1px solid var(--b)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid var(--b);border-radius:var(--r);box-shadow:0 2px 10px #1028230b}.card{padding:18px}.card span{font-size:13px;color:var(--m)}.card strong{display:block;font-size:26px;margin-top:8px}.panel{padding:18px;margin-bottom:18px}.panel h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{border:1px solid var(--b);border-radius:12px;padding:15px;background:#fff}.tile b{display:block}.tile small{color:var(--m)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf2f0;font-size:14px}th{background:#f8faf9;color:#65756f}.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#dff7ec;color:#14613f}.pending{background:#fff3cd;color:#7a5a00}
.mcq{padding:16px;border:1px solid var(--b);border-radius:12px;margin:12px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.opt{padding:10px;border:1px solid var(--b);border-radius:9px;background:#fafcfa}
.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid var(--b);background:#fff;border-radius:999px;padding:8px 12px}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.login{max-width:440px;margin:60px auto;background:#fff;border:1px solid var(--b);border-radius:18px;padding:28px;box-shadow:0 18px 60px #1028231a}.login input{width:100%;padding:11px;border:1px solid #ccd9d5;border-radius:9px;margin:6px 0 14px}
.note{padding:12px 14px;border-radius:10px;background:#eaf7f1;color:#14573e;margin-bottom:18px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:18px}.hero h1{font-size:29px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>MCQ</b> Campus</div><div class="actions"><button class="mode" onclick="setRole('public')">Public</button><button class="mode" onclick="setRole('learner')">Learner</button><button class="mode" onclick="setRole('admin')">Admin</button><button class="mode" onclick="setRole('super')">Super Admin</button></div></header>
<div class="shell">
<aside class="side"><div class="role"><b id="roleTitle">Public Website</b><small id="roleSub">Visitor view</small></div><nav class="nav" id="nav"></nav></aside>
<main class="main" id="view"></main>
</div>
<script>
const sample=[
{id:1,q:'Which data structure uses FIFO?',a:['Stack','Queue','Tree','Graph'],c:'Queue',status:'Approved',cat:'Computer Science'},
{id:2,q:'What is 10% of 500?',a:['5','50','100','500'],c:'50',status:'Approved',cat:'Aptitude'},
{id:3,q:'Which search algorithm requires sorted data?',a:['Linear search','Binary search','DFS','BFS'],c:'Binary search',status:'Pending',cat:'Programming'}
];
let role='public',page='home';
const menus={
public:[['home','Home'],['categories','Categories'],['papers','Explore Papers'],['mcqs','MCQs'],['login','Login / Signup']],
learner:[['dashboard','Dashboard'],['practice','Practice MCQs'],['saved','Saved Papers'],['profile','Profile'],['home','Public Home']],
admin:[['dashboard','Dashboard'],['mcqs','MCQ Management'],['categories','Categories'],['papers','Papers & Jobs'],['review','Pending Review'],['home','Public Home']],
super:[['dashboard','Dashboard'],['mcqs','MCQ Management'],['categories','Categories'],['papers','Papers / Jobs / Years'],['admins','Admins'],['settings','Settings'],['activity','Activity'],['home','Public Home']]
};
function setRole(r){role=r;page=r==='public'?'home':'dashboard';render()}
function go(p){page=p;render()}
function nav(){document.getElementById('roleTitle').textContent={public:'Public Website',learner:'Learner Account',admin:'Admin Panel',super:'Super Admin Panel'}[role];document.getElementById('roleSub').textContent={public:'Visitor view',learner:'Signed-in learner',admin:'Content management',super:'Full system control'}[role];document.getElementById('nav').innerHTML=menus[role].map(x=>'<button class="'+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
const stats=()=>'<div class="cards">'+[['Total MCQs','1,248'],['Approved','1,201'],['Pending','47'],['Categories','18']].map(x=>'<article class="card"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></article>').join('')+'</div>';
const mcqs=()=>'<section class="panel"><h2>MCQs</h2>'+sample.map((x,i)=>'<div class="mcq"><b>'+(i+1)+'. '+x.q+'</b><div class="opts">'+x.a.map(o=>'<div class="opt">'+o+'</div>').join('')+'</div><small>'+x.cat+' · '+x.status+'</small></div>').join('')+'</section>';
function home(){return '<section class="hero"><h1>A little practice. A lot of progress.</h1><p>Explore subjects, practise MCQs and prepare with past papers for competitive exams across Pakistan.</p><div class="actions"><button class="btn primary" onclick="go(\'papers\')">Explore Papers</button><button class="btn ghost" onclick="go(\'categories\')">Browse Categories</button></div></section><div class="note">Temporary live preview of the complete MCQ Campus frontend structure.</div>'+stats()+'<section class="panel"><h2>Popular Categories</h2><div class="grid"><div class="tile"><b>💻 Programming</b><small>C, C++, Java, Python</small></div><div class="tile"><b>💾 Computer Science</b><small>DSA, DBMS, OS, Networks</small></div><div class="tile"><b>🌐 Current Affairs & GK</b><small>Pakistan and world knowledge</small></div></div></section>'+mcqs()}
function dashboard(){return '<h1>'+({learner:'My Learning',admin:'Admin Dashboard',super:'Super Admin Dashboard'}[role]||'Dashboard')+'</h1><p>Overview and recent activity.</p>'+stats()+'<section class="panel"><h2>Recent Activity</h2><table><tr><th>Item</th><th>Status</th><th>Updated</th></tr><tr><td>Computer Operator MCQs</td><td><span class="status">Approved</span></td><td>Today</td></tr><tr><td>PPSC Paper 2026</td><td><span class="status pending">Pending</span></td><td>Today</td></tr></table></section>'}
function categories(){return '<h1>Categories</h1><p>Main, sub and child categories.</p><div class="grid"><div class="tile"><b>💻 Programming</b><small>C · C++ · C# · Java · Python</small></div><div class="tile"><b>💾 Computer Science</b><small>DSA · DBMS · OS · Networks</small></div><div class="tile"><b>🧠 Aptitude</b><small>Math · Analytical · Reasoning</small></div><div class="tile"><b>🌐 Current Affairs & GK</b><small>Pakistan · World · Organizations</small></div><div class="tile"><b>🖥️ Software Engineering</b><small>SDLC · Testing · UML</small></div><div class="tile"><b>🛠️ Engineering Essentials</b><small>Core engineering subjects</small></div></div>'}
function papers(){return '<h1>Papers & Jobs</h1><p>Explore Paper → Job → Job Year → MCQs.</p><section class="panel"><table><tr><th>Paper</th><th>Jobs</th><th>Years</th></tr><tr><td>PPSC</td><td>Computer Operator, Assistant, Lecturer</td><td>2024, 2025, 2026</td></tr><tr><td>FPSC</td><td>Inspector, Assistant Director</td><td>2025, 2026</td></tr><tr><td>NTS</td><td>Multiple Jobs</td><td>2024–2026</td></tr></table></section>'}
function manage(){return '<h1>MCQ Management</h1><div class="actions"><button class="btn primary">Add MCQ</button><button class="btn ghost">Bulk Import</button></div><section class="panel"><table><tr><th>ID</th><th>Question</th><th>Category</th><th>Status</th><th>Action</th></tr>'+sample.map(x=>'<tr><td>#'+x.id+'</td><td>'+x.q+'</td><td>'+x.cat+'</td><td><span class="status '+(x.status==='Pending'?'pending':'')+'">'+x.status+'</span></td><td>Edit</td></tr>').join('')+'</table></section>'}
function review(){return '<h1>Pending Review</h1><p>Questions waiting for approval.</p>'+mcqs()}
function admins(){return '<h1>Admin Management</h1><div class="actions"><button class="btn primary">Add Admin</button></div><section class="panel"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr><tr><td>Content Admin</td><td>admin@mcqcampus.pk</td><td>Admin</td><td><span class="status">Active</span></td></tr><tr><td>Super Admin</td><td>superadmin@mcqcampus.pk</td><td>Super Admin</td><td><span class="status">Active</span></td></tr></table></section>'}
function settings(){return '<h1>Settings</h1><section class="panel"><h2>Site Settings</h2><div class="grid"><div class="tile"><b>Google Analytics</b><small>Manage tracking ID from Super Admin panel</small></div><div class="tile"><b>Google AdSense</b><small>Enable/disable ads and placements</small></div><div class="tile"><b>Theme</b><small>Light mode default · Green dark mode</small></div></div></section>'}
function login(){return '<div class="login"><div class="brand"><b>MCQ</b> Campus</div><h1>Sign in</h1><p>Use learner, admin or super admin account.</p><label>Email<input placeholder="you@example.com"></label><label>Password<input type="password" placeholder="••••••••"></label><button class="btn primary" style="width:100%" onclick="setRole(\'learner\')">Sign in</button><p><small>Demo preview — authentication is not connected yet.</small></p></div>'}
function render(){nav();let h='';if(page==='home')h=home();else if(page==='dashboard')h=dashboard();else if(page==='categories')h=categories();else if(page==='papers')h=papers();else if(page==='mcqs')h=role==='public'?mcqs():manage();else if(page==='review'||page==='practice'||page==='saved')h=mcqs();else if(page==='admins')h=admins();else if(page==='settings')h=settings();else if(page==='activity')h=dashboard();else if(page==='profile')h='<h1>Profile</h1><section class="panel"><h2>Learner Profile</h2><p>Name, email, avatar, saved papers and practice history.</p></section>';else if(page==='login')h=login();document.getElementById('view').innerHTML=h}render();
</script>
</body></html>
