<!doctype html>
<html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102823"><meta name="description" content="{{ settings.seo_description }}"><title>{{ settings.seo_title }}</title><link rel="icon" type="image/png" sizes="48x48" href="assets/images/favicon.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png"><link rel="apple-touch-icon" href="assets/images/favicon-192.png"><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/css/styles.css">
{% if settings.analytics_enabled and settings.google_analytics_id %}<script async src="https://www.googletagmanager.com/gtag/js?id={{ settings.google_analytics_id }}"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ settings.google_analytics_id|escapejs }}');</script>{% endif %}
{% if settings.adsense_enabled and settings.adsense_client_id %}<script async crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js?client={{ settings.adsense_client_id }}"></script>{% endif %}
<style>
.mcq-boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f7fbf9 0%,#fff 55%,#f4f8f6 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17352f}.mcq-boot__card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}.mcq-boot__mark{position:relative;width:82px;height:82px;display:grid;place-items:center}.mcq-boot__mark::before{content:"";position:absolute;inset:-7px;border:3px solid rgba(20,120,86,.12);border-top-color:#147856;border-radius:50%;animation:mcq-spin .9s linear infinite}.mcq-boot__logo{width:72px;height:72px;object-fit:contain;border-radius:18px;box-shadow:0 10px 28px rgba(16,40,35,.12);background:#fff}.mcq-boot__title{margin:4px 0 0;font-size:1.05rem;font-weight:750;letter-spacing:-.01em}.mcq-boot__text{margin:0;color:#61736e;font-size:.9rem}.mcq-boot__dots{display:flex;gap:6px;margin-top:2px}.mcq-boot__dots i{width:6px;height:6px;border-radius:999px;background:#147856;animation:mcq-pulse 1.1s ease-in-out infinite}.mcq-boot__dots i:nth-child(2){animation-delay:.14s}.mcq-boot__dots i:nth-child(3){animation-delay:.28s}@keyframes mcq-spin{to{transform:rotate(360deg)}}@keyframes mcq-pulse{0%,100%{opacity:.28;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.mcq-boot__mark::before,.mcq-boot__dots i{animation:none}}
</style></head><body><a class="skip" href="#main">Skip to content</a><div id="app"><main class="mcq-boot" id="main" aria-busy="true"><div class="mcq-boot__card" role="status" aria-live="polite"><div class="mcq-boot__mark" aria-hidden="true"><img class="mcq-boot__logo" src="assets/images/logo.png" alt=""></div><p class="mcq-boot__title">MCQ Campus</p><p class="mcq-boot__text">Loading your learning space…</p><span class="mcq-boot__dots" aria-hidden="true"><i></i><i></i><i></i></span></div></main></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><noscript>This interactive frontend needs JavaScript enabled.</noscript><script src="assets/js/service.js"></script><script src="assets/js/importer.js"></script><script src="assets/js/ui.js"></script><script src="assets/js/public.js"></script><script src="assets/js/admin.js"></script><script src="assets/js/carousel.js"></script><script src="assets/js/seo.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/app.js"></script></body></html>
