<base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102823"><meta name="mcq-asset-version" content="{{ asset_version }}"><meta name="author" content="MCQCampus"><meta name="application-name" content="MCQCampus">

<!-- ===== FAVICON START (naye links) ===== -->
<link rel="icon" href="/assets/favicon/favicon.ico?v={{ asset_version }}" type="image/x-icon">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/genfavicon-16.png?v={{ asset_version }}">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/genfavicon-32.png?v={{ asset_version }}">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon/genfavicon-48.png?v={{ asset_version }}">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon/genfavicon-512.png?v={{ asset_version }}">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon-180x180.png?v={{ asset_version }}">
<link rel="manifest" href="/site.webmanifest?v={{ asset_version }}">
<!-- ===== FAVICON END ===== -->

<meta name="description" content="{{ seo_description|default:settings.seo_description }}"><title>{{ seo_title|default:settings.seo_title }}</title><link rel="canonical" href="{{ canonical_url|default:'https://www.mcqcampus.com/' }}"><meta property="og:site_name" content="MCQCampus"><meta property="og:title" content="{{ seo_title|default:settings.seo_title }}"><meta property="og:description" content="{{ seo_description|default:settings.seo_description }}"><meta property="og:url" content="{{ canonical_url|default:'https://www.mcqcampus.com/' }}"><meta property="og:type" content="website"><meta property="og:locale" content="en_PK"><meta property="og:image" content="{{ seo_origin|default:'https://www.mcqcampus.com' }}/assets/favicon/genfavicon-512.png?v={{ asset_version }}"><meta property="og:image:width" content="512"><meta property="og:image:height" content="512"><meta property="og:image:alt" content="MCQCampus logo"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="{{ seo_origin|default:'https://www.mcqcampus.com' }}/assets/favicon/genfavicon-512.png?v={{ asset_version }}"><meta name="twitter:title" content="{{ seo_title|default:settings.seo_title }}"><meta name="twitter:description" content="{{ seo_description|default:settings.seo_description }}"><meta name="robots" content="{{ seo_robots|default:'index,follow' }}"><script id="server-jsonld" type="application/ld+json">{{ seo_jsonld|safe }}</script><link rel="stylesheet" href="assets/css/styles.css?v={{ asset_version }}"><link rel="preload" as="style" href="assets/css/premium.css?v={{ asset_version }}" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="assets/css/premium.css?v={{ asset_version }}"></noscript><link rel="preload" as="style" href="assets/css/design-refresh.css?v={{ asset_version }}" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="assets/css/design-refresh.css?v={{ asset_version }}"></noscript>
{% if settings.analytics_enabled and settings.google_analytics_id %}<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin><link rel="dns-prefetch" href="//www.googletagmanager.com"><script async src="https://www.googletagmanager.com/gtag/js?id={{ settings.google_analytics_id }}"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ settings.google_analytics_id|escapejs }}');</script>{% endif %}
{% if settings.adsense_enabled and settings.adsense_client_id %}<script async crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js?client={{ settings.adsense_client_id }}"></script>{% endif %}
